name: Keep backend awake

# Render's free tier puts the backend to sleep after ~15 minutes without traffic.
# This pings the health endpoint every 10 minutes so visitors don't hit a cold start.
# (GitHub pauses scheduled workflows after 60 days of repo inactivity; a free
# UptimeRobot monitor on the same URL is a more durable alternative.)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping backend health endpoint
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 60 https://ecosentinel-backend-refn.onrender.com/api/health
